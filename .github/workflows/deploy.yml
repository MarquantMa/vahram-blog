name: Deploy to Cloudflare Pages (vahram.pages.dev)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages (vahram.pages.dev)
        run: |
          npx wrangler pages project create vahram --production-branch=main || true
          npx wrangler pages deploy dist --project-name=vahram --branch=main
