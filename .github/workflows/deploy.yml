name: Deploy to Cloudflare Pages (vahram.pages.dev)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check Cloudflare credentials and Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vahram
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notice on Cloudflare Deployment Configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "ℹ️ Note: Direct GitHub Actions deployment requires CLOUDFLARE_API_TOKEN."
          echo "👉 Recommended: Connect your GitHub repo directly inside Cloudflare Pages Dashboard (Workers & Pages -> vahram -> Connect Git)."
          echo "👉 Once connected in Cloudflare Dashboard, Cloudflare automatically builds and deploys on every push without any secret configuration."
