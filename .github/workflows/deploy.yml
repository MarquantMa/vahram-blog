name: Deploy to Cloudflare Pages (vahram.pages.dev)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages via Wrangler (if secrets provided)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler pages deploy dist --project-name=vahram --branch=main

      - name: Deployment Information Notice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "✅ Build and tests passed successfully."
          echo "ℹ️ Note: If you have connected GitHub directly in the Cloudflare Dashboard (Recommended),"
          echo "   Cloudflare automatically triggers a build and deploys to vahram.pages.dev on push."
          echo "ℹ️ Alternatively, configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Secrets."
